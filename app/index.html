<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>California Zone Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="brand">🏡 California Zone Finder</div>
    <form id="searchForm" class="search">
      <label>ZIP
        <input id="zip" type="text" inputmode="numeric" maxlength="5" value="95131" />
      </label>
      <label>Radius (mi)
        <input id="radius" type="number" min="1" max="50" value="8" />
      </label>
      <button type="submit">Search</button>
    </form>
    <div class="view-toggle">
      <span class="tg-label">Level:</span>
      <button type="button" id="btnZip" class="vt active">ZIP</button>
      <button type="button" id="btnHood" class="vt">Neighborhood</button>
      <span class="tg-sep"></span>
      <span class="tg-label">View:</span>
      <button type="button" id="btnMap" class="vt active">Map</button>
      <button type="button" id="btnTable" class="vt">Table</button>
      <label class="basemap-toggle"><input type="checkbox" id="basemap" checked /> Base map</label>
    </div>
    <div id="status" class="status"></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div id="results" class="results"></div>
      <div id="detail" class="detail"></div>
    </aside>
    <main class="main-area">
      <div id="map"></div>
      <div id="tableWrap" class="table-wrap hidden">
        <table id="zoneTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Data as globals (lets the page work by double-clicking index.html, no server needed) -->
  <script src="zones.js"></script>
  <script src="neighborhoods.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
